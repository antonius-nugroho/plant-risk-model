paths:
  raw: data/raw
  column_description: data/column_description
  processed: data/processed

# Data files are discovered in paths.raw by glob pattern, so a new year only needs its files dropped in.
files:
  business: "Business Data *.csv"
  failure: "Failure Data *.*"
  maintenance: "Maintenance Cost *.csv"
  pricing: "Pricing*.csv"
  coal: "Coal Monitoring *.csv"
  # reference table, read from paths.column_description
  cause_codes: System Component Cause Code.csv

# unit_status codes -> event class. Codes not listed are "unassigned" and
# are reported but kept out of the risk totals until a decision is made.
event_scope:
  # Loss events are candidates to be promoted to risk later: move a status between lists.
  risk: [FD.MP, SF]
  loss_event: [FO, MO, FD, MD, PD, FD.SYS]
  excluded: [NC, RS, PO, PE, SHD, SUD]
  # failure_impact values that count as risk when the status is not listed above
  risk_impacts: [Tripped]

# statuses offered in the Ranking tab dropdown
ranking_statuses:
  FO: Forced outage
  MO: Maintenance outage
  FD: Forced derated
  MD: Maintenance derated

opportunity_loss:
  # bpp_rp_kwh or selling_price_rp_kwh, looked up for the month the loss occurred
  price_basis: bpp_rp_kwh
  # Set a number (Rp/kWh) to override the monthly price for every unit,
  # or a mapping such as {Unit 3: 900, Unit 4: 950}. null = use the monthly price.
  manual_price_rp_per_kwh: null
