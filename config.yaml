paths:
  raw: data/raw
  column_description: data/column_description
  processed: data/processed

# Data files are discovered in paths.raw by glob pattern, so a new year only needs its files dropped in.
files:
  business: "Business Data *.csv"
  failure: "Failure Data *.*"
  maintenance: "Maintenance Cost *.csv"
  pricing: "Pricing*.csv"
  coal: "Coal Monitoring *.csv"
  # reference table, read from paths.column_description
  cause_codes: System Component Cause Code.csv

# unit_status codes -> event class. Codes not listed are "unassigned" and
# are reported but kept out of the risk totals until a decision is made.
event_scope:
  # Loss events are candidates to be promoted to risk later: move a status between lists.
  risk: [FD.MP, SF]
  loss_event: [FO, MO, FD, MD, PD, FD.SYS]
  excluded: [NC, RS, PO, PE, SHD, SUD]
  # failure_impact values that count as risk when the status is not listed above
  risk_impacts: [Tripped]

# statuses offered in the Ranking tab dropdown
ranking_statuses:
  FO: Forced outage
  MO: Maintenance outage
  FD: Forced derated
  MD: Maintenance derated

# Consequence (impact scale) is measured against a yearly risk limit:
#   risk limit = k x revenue of the previous year (the first year in the data uses its own revenue)
# Each event's loss is compared with the risk limit of the year it started, and the share is mapped to
# a level: Very Low (<= 20%), Low (<= 40%), Moderate (<= 60%), High (<= 80%), Very High (above 80%).
risk_limit:
  k: 0.02   # change according to the company's policy
impact_scale:   # upper bound of each level, as a share of the risk limit
  - {name: Very Low, upper: 0.2}
  - {name: Low, upper: 0.4}
  - {name: Moderate, upper: 0.6}
  - {name: High, upper: 0.8}
  - {name: Very High, upper: 1.0}

# Likelihood (probability) scale: share of the months in the window in which the failure occurred
# at least once. The window is the selected years; with more than five years selected, the latest five.
likelihood_scale:   # upper bound of each level, as a share of the window's months
  - {name: Rare, upper: 0.2}
  - {name: Unlikely, upper: 0.4}
  - {name: Possible, upper: 0.6}
  - {name: Likely, upper: 0.8}
  - {name: Almost certain, upper: 1.0}
max_window_years: 5

opportunity_loss:
  # bpp_rp_kwh or selling_price_rp_kwh, looked up for the month the loss occurred
  price_basis: bpp_rp_kwh
  # Set a number (Rp/kWh) to override the monthly price for every unit,
  # or a mapping such as {Unit 3: 900, Unit 4: 950}. null = use the monthly price.
  manual_price_rp_per_kwh: null
